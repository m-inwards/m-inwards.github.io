<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurable Twister Spinner</title>
  <style>
    /* CSS Variables and Base Styles (Retained Modern Look) */
    :root {
      --color-primary: #1e88e5;
      --color-accent: #333333;
      --color-background: #f4f7f6;
      --color-card: #ffffff;
      --color-text-dark: #333333;
      --color-text-light: #555555;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--color-background);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--color-card);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    h1 {
      color: var(--color-primary);
      margin-bottom: 30px;
      font-size: 1.8em;
      font-weight: 600;
    }

    /* --- Screen Switching --- */
    #gameScreen, #configScreen {
      transition: opacity 0.3s, transform 0.3s;
      position: relative;
      width: 100%;
    }
    .hidden {
      opacity: 0;
      height: 0;
      overflow: hidden;
      padding: 0;
      margin: 0;
      transform: translateY(10px);
    }

    /* --- COMMAND DISPLAY AREA (GAME SCREEN) --- */
    #commandDisplay {
      margin-bottom: 30px;
      border-radius: 15px;
      box-shadow: 5px 5px 10px #d0d0d0, -5px -5px 10px #ffffff;
      overflow: hidden;
    }

    #limbDisplayWrapper {
      background-color: #f0f0f0;
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    #limbLabel {
      font-size: 0.9em;
      color: var(--color-text-light);
      margin-bottom: 5px;
    }

    #limbDisplay {
      font-size: 1.8em;
      font-weight: 700;
      color: var(--color-text-dark);
      text-transform: uppercase;
    }

    #colorDisplayWrapper {
      padding: 20px;
      min-height: 100px;
    }

    #colorLabel {
      font-size: 0.9em;
      color: var(--color-text-light);
      margin-bottom: 10px;
    }

    #colorDisplay {
      font-size: 1.4em;
      font-weight: 800;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    /* --- STYLING FOR COLOR OPTIONS (PLAIN TEXT) --- */
    .color-option {
      padding: 10px 15px;
      border-radius: 8px;
      color: var(--color-text-dark);
      background-color: transparent;
      box-shadow: none;
      transition: all 0.3s ease;
      min-width: 80px;
      text-transform: uppercase;
    }

    .color-option:not(.selected) {
      border: 4px solid #555555;
    }

    .color-option.selected {
      border: 4px solid var(--color-accent);
    }

    .color-option.single-large {
      font-size: 2.2em;
      padding: 15px 20px;
      min-width: 150px;
    }

    /* --- BUTTONS --- (Retained) */
    .button-group button {
      border: none;
      padding: 15px 30px;
      font-size: 1.1em;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      font-weight: 700;
    }

    #generateButton, #saveConfigButton {
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      color: white;
      box-shadow: 0 6px 12px rgba(76, 175, 80, 0.3);
    }

    #generateButton:active, #saveConfigButton:active {
      transform: scale(0.98);
      box-shadow: 0 3px 6px rgba(76, 175, 80, 0.4);
      background: linear-gradient(90deg, #388e3c, #689f38);
    }

    #resetButton {
      background-color: transparent;
      color: var(--color-text-light);
      border: 2px solid #ccc;
      box-shadow: none;
    }

    #resetButton:active {
      transform: scale(0.98);
      background-color: #e0e0e0;
    }

    /* --- CONFIGURATION SCREEN STYLES --- */
    #configScreen h2 {
      color: var(--color-text-dark);
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .config-section {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: left;
    }

    .config-section label {
      font-weight: 600;
      color: var(--color-primary);
      display: block;
      margin-bottom: 10px;
    }

    /* --- COLOR SELECTION AS MOBILE-FRIENDLY PILLS --- */
    #colorList {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 0;
      border: none; /* Removed list border */
      max-height: none; /* No vertical scroll for pills */
      overflow-y: visible;
    }

    .color-pill {
      flex-grow: 1; /* Allow pills to expand */
      text-align: center;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 20px; /* Pill shape */
      border: 2px solid #ccc;
      background-color: #f0f0f0;
      color: var(--color-text-light);
      font-weight: 600;
      transition: all 0.2s;
      min-width: 80px;
    }

    .color-pill.active {
      border-color: var(--color-primary);
      background-color: var(--color-primary);
      color: white;
      box-shadow: 0 2px 5px rgba(30, 136, 229, 0.3);
    }

    .color-pill:active {
      transform: scale(0.98);
    }

    /* Hide the original checkbox inputs */
    .hidden-checkbox {
      display: none !important;
    }

    /* Radio Buttons for Color Count (Retained) */
    #colorCountOptions {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }
    #colorCountOptions label {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #colorCountOptions input[type="radio"]:checked + label {
      background-color: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    #colorCountOptions input[type="radio"] {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Twister Spinner 🌀</h1>

  <div id="configScreen" class="hidden">
    <h2>Game Configuration</h2>

    <div class="config-section">
      <label>Active Colors (Tap to toggle):</label>
      <div id="colorList">
      </div>
    </div>

    <div class="config-section">
      <label>Number of Color Options per Spin (1-3):</label>
      <div id="colorCountOptions">
        <input type="radio" id="count1" name="colorCount" value="1" checked>
        <label for="count1">1 Option</label>
        <input type="radio" id="count2" name="colorCount" value="2">
        <label for="count2">2 Options</label>
        <input type="radio" id="count3" name="colorCount" value="3">
        <label for="count3">3 Options</label>
      </div>
    </div>

    <div class="button-group">
      <button id="saveConfigButton" onclick="saveConfig()">START GAME</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div id="commandDisplay">
      <div id="limbDisplayWrapper">
        <div id="limbLabel">PLACE THIS LIMB:</div>
        <div id="limbDisplay"></div>
      </div>

      <div id="colorDisplayWrapper">
        <div id="colorLabel">ON THIS COLOR:</div>
        <div id="colorDisplay"></div>
      </div>
    </div>

    <div class="button-group">
      <button id="generateButton" onclick="generateCommand()">NEXT COMMAND</button>
      <button id="resetButton" onclick="showConfig()">RESET GAME / CONFIG</button>
    </div>
  </div>
</div>

<script>
  const ALL_COLORS = [
          "Yellow", "Orange", "Grey", "Wurple", "Pink", "Blue", "Gred", "Green", "Red",
          "White", "Purple", "Brown", "Black", "Light Blue", "Wood"
  ];
  const LIMBS_CYCLE = ["Left Hand", "Right Hand", "Left Foot", "Right Foot"];
  const LIMBS_RANDOM = [...LIMBS_CYCLE];

  // Configuration storage
  let pressCount = 0;
  let activeColors = [...ALL_COLORS]; // Default to all active
  let colorOptionCount = 1; // Default to 1 option

  // DOM elements
  const configScreen = document.getElementById('configScreen');
  const gameScreen = document.getElementById('gameScreen');
  const colorList = document.getElementById('colorList');
  const limbDisplay = document.getElementById('limbDisplay');
  const colorDisplay = document.getElementById('colorDisplay');
  const generateButton = document.getElementById('generateButton');

  function getRandomElement(arr) {
    const randomIndex = Math.floor(Math.random() * arr.length);
    return arr[randomIndex];
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  /* --- Configuration Logic --- */

  function toggleColor(color) {
    const index = activeColors.indexOf(color);
    if (index > -1) {
      // Deactivate
      if (activeColors.length > 1) {
        activeColors.splice(index, 1);
      } else {
        alert("Must keep at least one color active.");
        return;
      }
    } else {
      // Activate
      activeColors.push(color);
    }
    // Re-render to update the pill states
    renderColorCheckboxes();
  }

  function renderColorCheckboxes() {
    colorList.innerHTML = ''; // Clear existing list
    ALL_COLORS.forEach(color => {
      const isActive = activeColors.includes(color);

      // Create a clickable pill div
      const pill = document.createElement('div');
      pill.className = `color-pill ${isActive ? 'active' : ''}`;
      pill.textContent = color.toUpperCase();
      pill.dataset.color = color;

      // Add event listener to toggle the color
      pill.addEventListener('click', () => toggleColor(color));

      colorList.appendChild(pill);
    });

    document.getElementById(`count${colorOptionCount}`).checked = true;
  }

  function saveConfig() {
    if (activeColors.length === 0) {
      alert("Please select at least one color to play the game.");
      return;
    }

    // activeColors is already updated via toggleColor

    const selectedCount = document.querySelector('input[name="colorCount"]:checked');
    colorOptionCount = parseInt(selectedCount.value);

    startGame();
  }

  function showConfig() {
    configScreen.classList.remove('hidden');
    gameScreen.classList.add('hidden');
    renderColorCheckboxes();
  }

  function startGame() {
    gameScreen.classList.remove('hidden');
    configScreen.classList.add('hidden');
    resetGameLogic();
  }

  function resetGameLogic() {
    pressCount = 0;
    limbDisplay.textContent = "—";
    colorDisplay.innerHTML = `<span style="color:var(--color-primary);">GO!</span>`;
    colorDisplay.className = '';

    generateButton.textContent = "START COMMAND";
  }

  /* --- Game Command Logic --- */

  function generateCommand() {
    let selectedLimb;

    pressCount++;

    // 1. Determine the Limb based on the press count (Cycling first 4)
    if (pressCount <= LIMBS_CYCLE.length) {
      selectedLimb = LIMBS_CYCLE[pressCount - 1];
    } else {
      selectedLimb = getRandomElement(LIMBS_RANDOM);
    }

    // 2. Determine the Color(s)

    const shuffledColors = shuffleArray([...activeColors]);
    const options = shuffledColors.slice(0, colorOptionCount);

    const correctColor = getRandomElement(options);

    // 3. Update the Display
    limbDisplay.textContent = selectedLimb;
    colorDisplay.innerHTML = '';

    options.forEach(color => {
      const optionDiv = document.createElement('div');
      optionDiv.className = `color-option`;
      optionDiv.textContent = color.toUpperCase();

      // Apply special styling for single option
      if (colorOptionCount === 1) {
        optionDiv.classList.add('single-large', 'selected');
      }

      // Visually highlight the one the player needs to hit (only when multiple options exist)
      if (colorOptionCount > 1 && color === correctColor) {
        optionDiv.classList.add('selected');
      }

      colorDisplay.appendChild(optionDiv);
    });

    generateButton.textContent = "NEXT COMMAND";
  }

  // Initialize the app by showing the config screen
  window.onload = showConfig;
</script>

</body>
</html>
